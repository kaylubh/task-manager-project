<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="taskManager.js" type="module"></script>
    <title>Task Manager</title>
  </head>
  <body>
    <header>
      <h1>Task Manager</h1>
    </header>
    <main>
      <section id="task-panel">
        <form id="task-add-form">
          <input
            type="text"
            id="task-name"
            name="task-name"
            placeholder="Enter task name"
            required />
          <select id="task-priority" name="task-priority" required>
            <option value="" disabled selected>Select priority</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
          <input type="checkbox" id="task-important" name="task-important" />
          <label for="task-important">Important?</label>
          <button type="submit">Add Task</button>
        </form>
      </section>
      <section id="task-list">
        <div id="taskmanager">
          <table>
            <thead>
              <tr>
                <th>Task</th>
                <th>Priority</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
